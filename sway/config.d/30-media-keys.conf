# Media / function keys (XF86 keysyms — generic, host-independent).
# On keyboards without a given key the binding simply never fires; if a
# helper tool (brightnessctl/wpctl/playerctl) is absent the exec is a no-op.
# --locked = keys keep working while swaylock is active.
#
# Volume/brightness/media go through `swayosd-client`, which performs the
# action AND draws the macOS-style on-screen display. It talks to
# swayosd-server (started in 01-app-asahi.conf). If the server is not running
# the client exits non-zero and the action is lost, which is why every binding
# below falls back to the raw tool via `||`.

# Screen brightness
bindsym --locked XF86MonBrightnessDown exec swayosd-client --brightness lower || brightnessctl set 5%-
bindsym --locked XF86MonBrightnessUp exec swayosd-client --brightness raise || brightnessctl set 5%+

# Search / launcher key
bindsym XF86Search exec $menu

# Keyboard backlight
# SwayOSD's --brightness targets backlight devices; the keyboard LED is a
# leds-class device, so it stays on brightnessctl and relies on the server's
# `keyboard_backlight = true` to draw the OSD.
bindsym --locked XF86KbdBrightnessDown exec brightnessctl -d kbd_backlight set 10%-
bindsym --locked XF86KbdBrightnessUp exec brightnessctl -d kbd_backlight set 10%+

# Media transport
bindsym --locked XF86AudioPrev exec swayosd-client --playerctl prev || playerctl previous
bindsym --locked XF86AudioPlay exec swayosd-client --playerctl play-pause || playerctl play-pause
bindsym --locked XF86AudioNext exec swayosd-client --playerctl next || playerctl next

# Mute / volume
bindsym --locked XF86AudioMute exec swayosd-client --output-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioLowerVolume exec swayosd-client --output-volume lower || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioRaiseVolume exec swayosd-client --output-volume raise || wpctl set-volume -l 2.0 @DEFAULT_AUDIO_SINK@ 5%+

# Mic mute
bindsym --locked XF86AudioMicMute exec swayosd-client --input-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
