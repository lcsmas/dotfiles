# SwayOSD — macOS-style on-screen display for volume, brightness, caps/num
# lock, keyboard layout and low battery.
#
# NOTHING IS LAUNCHED HERE ON PURPOSE.
#
# The OSD components run as systemd USER SERVICES bound to sway-session.target,
# not as sway `exec` lines:
#
#   swayosd-server.service            draws the overlay
#   swayosd-layout-watcher.service    OSD on keyboard layout switch
#   swayosd-battery-watcher.service   OSD on low battery
#
# Reason: sway's /etc/sway/config.d/10-systemd-cgroups.conf reassigns
# exec'd processes to per-app systemd scopes by watching `window:new` events.
# These are background/layer-shell processes with no ordinary window, so that
# script never sees them; its own docs recommend systemd user services for
# exactly this case. Using `exec` also re-launches a second server on every
# `swaymsg reload`, and swayosd-server refuses to start when one is already
# running ("An instance of SwayOSD is already running!").
#
# Unit files: dotfiles/systemd/user/ (symlinked into ~/.config/systemd/user).
# Caps/Num Lock come from the SYSTEM service swayosd-libinput-backend.service.
#
# The media keys themselves are bound in 30-media-keys.conf.
